<!doctype html><html><head><meta charset="utf-8"><title>EggLive 透明输出</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}canvas{display:block;width:100%;height:100%}video{display:none}</style></head><body><canvas id="canvas" width="1280" height="720"></canvas><video id="video" autoplay muted playsinline></video><script>
const canvas=document.getElementById('canvas'),video=document.getElementById('video'),gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:true,preserveDrawingBuffer:true});
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 uv;void main(){uv=vec2((p.x+1.0)*0.5,(1.0-p.y)*0.5);gl_Position=vec4(p,0.0,1.0);}'));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;uniform sampler2D image;varying vec2 uv;void main(){vec3 color=texture2D(image,vec2(uv.x*0.5,uv.y)).rgb;float alpha=texture2D(image,vec2(0.5+uv.x*0.5,uv.y)).r;alpha=smoothstep(0.015,0.985,alpha);gl_FragColor=vec4(min(color,vec3(alpha)),alpha);}'));gl.linkProgram(program);gl.useProgram(program);
const vertices=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vertices);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const position=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
let socket,pc,frames=0,lastFrame=0,candidates=[],generation=0,connectionStarted=0;
function send(m){if(socket?.readyState===1)socket.send(JSON.stringify(m));}
function draw(){if(video.readyState>=2){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);frames++;lastFrame=performance.now();}}
function animate(g){if(g!==generation)return;draw();if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(()=>animate(g));else setTimeout(()=>animate(g),1000/30);}
function connect(){connectionStarted=performance.now();socket=new WebSocket('ws://'+location.host+'/frames?transport=rtc');
 socket.onmessage=async e=>{try{const m=JSON.parse(e.data);if(m.type==='offer'){
  pc?.close();pc=new RTCPeerConnection({iceServers:[]});connectionStarted=performance.now();
  pc.onicecandidate=e=>{if(e.candidate)send({type:'candidate',candidate:e.candidate.toJSON()});};
  pc.ontrack=e=>{video.srcObject=e.streams[0];video.play().then(()=>animate(++generation));};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')socket.close();};
  await pc.setRemoteDescription(m.description);for(const c of candidates)await pc.addIceCandidate(c);candidates=[];
  await pc.setLocalDescription(await pc.createAnswer());send({type:'answer',description:pc.localDescription});
 }else if(m.type==='candidate'){if(pc?.remoteDescription)await pc.addIceCandidate(m.candidate);else candidates.push(m.candidate);}
 }catch(e){window.outputError=e.message;}};
 socket.onclose=()=>{pc?.close();pc=null;candidates=[];generation++;video.srcObject=null;setTimeout(connect,1000);};socket.onerror=()=>socket.close();}
setInterval(()=>{const now=performance.now();if(now-lastFrame>2000){gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);}if(socket?.readyState===1&&now-Math.max(lastFrame,connectionStarted)>10000)socket.close();},500);
window.outputDiagnostics=()=>({frames,ageMs:lastFrame?performance.now()-lastFrame:null,connected:pc?.connectionState==='connected',transport:'WebRTC RGB+alpha',error:window.outputError});
connect();
</script></body></html>
